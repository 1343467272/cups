name: Build and Test

on:
  push:
    branches:
      - master
      - 2.4.x
  pull_request:
    branches:
      - master
      - 2.4.x
  workflow_dispatch:

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout CUPS sources
      uses: actions/checkout@v7
    - name: Show Ubuntu version
      run: cat /etc/os-release | grep PRETTY_NAME | awk -F '=' '{print $2}'
    - name: Update build environment
      run: sudo apt-get update --fix-missing -y && sudo apt-get upgrade --fix-missing -y
    - name: Install prerequisites
      run: sudo apt-get install -y avahi-daemon libavahi-client-dev libssl-dev libpam-dev libusb-1.0-0-dev zlib1g-dev
    - name: Configure CUPS
      env:
        CC: /usr/bin/gcc
      run: ./configure --enable-debug --enable-maintainer
    - name: Build CUPS
      run: make
    - name: Test CUPS
      run: make test
    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: ubuntu-openssl-test-results
        path: |
          cups/test.log
          test/*_log*.txt
          test/cups-str-*.html

  build-linux-gnutls:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout CUPS sources
      uses: actions/checkout@v7
    - name: Show Ubuntu version
      run: cat /etc/os-release | grep PRETTY_NAME | awk -F '=' '{print $2}'
    - name: Update build environment
      run: sudo apt-get update --fix-missing -y
    - name: Install prerequisites
      run: sudo apt-get install -y avahi-daemon libavahi-client-dev libgnutls28-dev libpam-dev libusb-1.0-0-dev zlib1g-dev
    - name: Configure CUPS
      env:
        CC: /usr/bin/gcc
        CXX: /usr/bin/g++
      run: ./configure --enable-debug --enable-maintainer --with-tls=gnutls
    - name: Build CUPS
      run: make
    - name: Test CUPS
      run: make test
    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: ubuntu-gnutls-test-results
        path: |
          cups/test.log
          test/*_log*.txt
          test/cups-str-*.html

  build-macos:

    runs-on: macos-latest

    steps:
    - name: Checkout CUPS sources
      uses: actions/checkout@v7
    - name: Install prerequisites
      run: brew install cppcheck libjpeg libpng libusb openssl@3
    - name: Configure CUPS
      env:
        LDFLAGS: -L/opt/homebrew/Cellar/openssl@3/3.3.0/lib
      run: ./configure --enable-debug --enable-maintainer --disable-shared
    - name: Build CUPS
      run: make
    - name: Test CUPS
      run: make test
    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: macos-test-results
        path: |
          cups/test.log
          test/*_log*.txt
          test/cups-str-*.html

  build-windows:

    runs-on: windows-latest

    steps:
    - name: Checkout CUPS sources
      uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    - name: Restore NuGet packages
      run: nuget restore vcnet/cups.sln
    - name: Build CUPS (Release)
      run: msbuild vcnet/cups.sln /p:Configuration=Release /p:Platform=x64 /m
    - name: Copy LibreSSL DLLs to output
      run: Copy-Item vcnet/packages/libressl_native.redist.4.0.0/build/native/bin/x64/Release/*.dll vcnet/x64/Release/
    - name: Create launcher batch files
      shell: pwsh
      run: |
        $tools = @('cupstestppd','ippeveprinter','ippfind','ipptool')
        foreach ($t in $tools) {
          $bat = "@echo off`r`ncd /d `"%~dp0`"`r`n$t.exe %*`r`npause"
          Set-Content -Path "vcnet/x64/Release/$t.bat" -Value $bat -Encoding ASCII
        }
    - name: Compress
      run: 7z a -t7z cups-windows-x64.7z vcnet/x64/Release/*.* -mx=7
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: windows-x64-release
        path: cups-windows-x64.7z
